<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能座舱 AI 系统</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(20, 30, 50, 0.6);
            --border-color: rgba(0, 240, 255, 0.2);
            --accent-cyan: #00f0ff;
            --accent-blue: #0051ff;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Microsoft YaHei', sans-serif; background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 81, 255, 0.15) 0%, transparent 50%), radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.1) 0%, transparent 50%);
            color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        .top-header { height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: rgba(11, 15, 25, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); z-index: 10; }
        .top-header h1 { font-size: 18px; letter-spacing: 2px; color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
        .header-info { font-family: 'Orbitron', sans-serif; color: var(--accent-cyan); font-size: 20px; font-weight: bold; }

        .main-container { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }

        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }

        /* 聊天区 */
        .chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-box { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: thin; }
        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }
        .message { margin-bottom: 20px; padding: 15px 20px; border-radius: 16px; max-width: 80%; word-wrap: break-word; line-height: 1.6; font-size: 15px; }
        .user-msg { background: linear-gradient(135deg, rgba(0, 81, 255, 0.8) 0%, rgba(0, 153, 255, 0.8) 100%); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background: rgba(30, 41, 59, 0.8); color: var(--text-main); border: 1px solid rgba(255,255,255,0.05); margin-right: auto; border-bottom-left-radius: 4px; }
        .input-area { padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 15px; }
        input { flex: 1; padding: 16px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; outline: none; }
        button { padding: 0 35px; background: linear-gradient(135deg, #00f0ff 0%, #0051ff 100%); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }

        /* 右侧中控大屏 */
        .dashboard { flex: 1.3; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 100px 1fr 120px; gap: 15px; }
        .dash-card { padding: 20px; position: relative; display: flex; flex-direction: column; justify-content: center; cursor: pointer; transition: 0.2s; }
        .dash-card:hover { border-color: rgba(0, 240, 255, 0.6); background: rgba(30, 40, 60, 0.8); }
        .dash-card h3 { font-size: 13px; color: var(--text-sub); margin-bottom: 10px; }
        .dash-value { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 700; color: white; }

        .card-time { grid-column: 1 / 2; }
        .card-weather { grid-column: 2 / 3; }
        .card-speed { grid-column: 3 / 4; align-items: flex-end; justify-content: flex-end; }
        .speed-num { font-family: 'Orbitron', sans-serif; font-size: 48px; color: var(--accent-cyan); line-height: 1; }

        .card-battery { grid-column: 1 / 3; }
        #batteryChart { width: 100%; height: 100%; min-height: 200px; }
        
        .card-controls { grid-column: 3 / 4; display: flex; flex-direction: column; gap: 10px; justify-content: space-between; padding: 15px; cursor: default; }
        .card-controls:hover { border-color: var(--border-color); background: var(--panel-bg); } /* 取消大容器的悬浮反馈 */
        
        .control-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; color: white; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .control-btn:hover { background: rgba(0,240,255,0.1); border-color: var(--accent-cyan); }
        .control-btn.active { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0,240,255,0.2); }

        .dock-bar { grid-column: 1 / 4; display: flex; justify-content: space-around; align-items: center; padding: 0 50px; }
        .dock-item { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-sub); cursor: pointer; transition: 0.3s; padding: 10px 20px; border-radius: 12px; }
        .dock-item:hover { background: rgba(255,255,255,0.05); color: var(--accent-cyan); }
        .dock-icon { font-size: 24px; }

        .dot { animation: blink 1.4s infinite both; font-size: 20px; line-height: 10px;}
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="top-header">
        <h1>◈ SMART COCKPIT AI</h1>
        <div class="header-info" id="clockTime">00:00:00</div>
    </div>

    <div class="main-container">
        <!-- 左侧 AI 聊天区 -->
        <div class="chat-container glass-panel">
            <div class="chat-box" id="chatBox">
                <div class="message ai-msg">座舱系统已激活。您可以对我说话，也可以直接点击右侧屏幕上的卡片或图标进行操作。</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="输入语音指令..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
        
        <!-- 右侧中控大屏 -->
        <div class="dashboard">
            <!-- 顶部点击事件 -->
            <div class="dash-card glass-panel card-time" onclick="handleScreenClick('time')">
                <h3>当前时间</h3>
                <div class="dash-value" style="font-size: 22px;" id="clockDate">2026.11.04</div>
            </div>
            <div class="dash-card glass-panel card-weather" onclick="handleScreenClick('weather')">
                <h3>天气环境</h3>
                <div class="dash-value" style="font-size: 22px;">⛅ 26°C</div>
            </div>
            <div class="dash-card glass-panel card-speed">
                <h3>实时车速</h3>
                <div><span class="speed-num" id="speedNum">0</span> <span style="font-size: 10px;">km/h</span></div>
            </div>

            <!-- 中间点击事件 -->
            <div class="dash-card glass-panel card-battery">
                <div id="batteryChart"></div>
            </div>
            <div class="glass-panel card-controls">
                <!-- 空调 -->
                <div class="control-btn" id="acBtn" onclick="handleScreenClick('ac')">
                    <span class="control-icon">❄️</span>
                    <span class="control-text">空调 22°C</span>
                    <span style="font-size: 10px; color: #00f0ff;" id="acStatus">已开启</span>
                </div>
                <!-- 音乐 -->
                <div class="control-btn" id="musicBtn" onclick="handleScreenClick('music')">
                    <span class="control-icon">🎵</span>
                    <span class="control-text" id="musicText">正在播放: 星际漫游</span>
                </div>
                <!-- 车锁 -->
                <div class="control-btn" onclick="handleScreenClick('lock')">
                    <span class="control-icon" id="lockIcon">🔒</span>
                    <span class="control-text" id="lockText">车门已锁定</span>
                </div>
            </div>

            <!-- 底部 Dock 栏点击事件 -->
            <div class="glass-panel dock-bar">
                <div class="dock-item" onclick="handleScreenClick('car')"><span class="dock-icon">🚗</span><span>车辆</span></div>
                <div class="dock-item" onclick="handleScreenClick('nav')"><span class="dock-icon">🗺️</span><span>导航</span></div>
                <div class="dock-item" onclick="handleScreenClick('media')"><span class="dock-icon">🎵</span><span>音乐</span></div>
                <div class="dock-item" onclick="handleScreenClick('settings')"><span class="dock-icon">⚙️</span><span>设置</span></div>
            </div>
        </div>
    </div>

    <script>
        // ================= 全局状态 =================
        let currentSpeed = 0; let targetSpeed = 0;
        let isACOn = true; let isPlaying = true; let isLocked = true;
        let navConnected = false; let musicAppConnected = false;

        // ================= 1. 时钟与车速 =================
        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
            document.getElementById('clockDate').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
        }
        setInterval(updateClock, 1000); updateClock();

        setInterval(() => {
            // 平滑过渡车速
            if (currentSpeed < targetSpeed) currentSpeed += 2;
            else if (currentSpeed > targetSpeed) currentSpeed -= 3;
            
            // 模拟定速巡航时的微小波动
            let displaySpeed = currentSpeed;
            if (currentSpeed === targetSpeed && targetSpeed > 0) {
                displaySpeed = targetSpeed + (Math.floor(Math.random() * 3) - 1);
            }
            
            // 渲染到页面上
            document.getElementById('speedNum').innerText = Math.max(0, displaySpeed);
        }, 100);

        // ================= 2. 仪表盘初始化 =================
        var myChart = echarts.init(document.getElementById('batteryChart'));
        function updateBatteryChart(batteryValue) {
            var option = {
                series: [{
                    type: 'gauge', startAngle: 220, endAngle: -40, min: 0, max: 100,
                    progress: { show: true, width: 12, itemStyle: { color: batteryValue < 30 ? '#ff0055' : '#00f0ff', shadowBlur: 20 } },
                    axisLine: { lineStyle: { width: 12, color: [[1, 'rgba(255,255,255,0.05)']] } },
                    axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
                    anchor: { show: true, size: 10, itemStyle: { borderWidth: 2, borderColor: '#00f0ff', color: '#0b0f19' } },
                    title: { show: true, offsetCenter: [0, '70%'], fontSize: 14, color: '#94a3b8' },
                    detail: { valueAnimation: true, fontSize: 36, fontFamily: 'Orbitron', offsetCenter: [0, '20%'], color: batteryValue < 30 ? '#ff0055' : '#fff', formatter: '{value}%' },
                    data: [{ value: batteryValue, name: '动力电池' }]
                }]
            };
            myChart.setOption(option);
        }
        updateBatteryChart(100);

        // ================= 3. 触控交互 =================
        function handleScreenClick(action) {
            let reply = "";
            switch(action) {
                case 'time':
                    const d = new Date();
                    reply = `现在是北京时间 ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}点${d.getMinutes()}分，${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]}。`;
                    break;
                case 'weather':
                    reply = "当前天气多云，气温 26 摄氏度，东南风 3 级，空气质量优，非常适合出行。";
                    break;
                case 'ac':
                    isACOn = !isACOn;
                    const acBtn = document.getElementById('acBtn');
                    const acStatus = document.getElementById('acStatus');
                    if (isACOn) { acBtn.classList.add('active'); acStatus.innerText = "已开启"; acStatus.style.color = "#00f0ff"; reply = "空调已打开，设定温度为22度。"; }
                    else { acBtn.classList.remove('active'); acStatus.innerText = "已关闭"; acStatus.style.color = "#94a3b8"; reply = "空调已关闭。"; }
                    break;
                case 'music':
                    if (!musicAppConnected) {
                        reply = "检测到您尚未连接手机音乐软件，请在手机端打开蓝牙音乐以完成连接。";
                        musicAppConnected = true; 
                        document.getElementById('musicText').innerText = "已连接手机音乐";
                    } else {
                        isPlaying = !isPlaying;
                        document.getElementById('musicBtn').classList.toggle('active', isPlaying);
                        document.getElementById('musicText').innerText = isPlaying ? "正在播放: 星际漫游" : "音乐已暂停";
                        reply = isPlaying ? "已为您继续播放音乐。" : "音乐已暂停。";
                    }
                    break;
                case 'lock':
                    isLocked = !isLocked;
                    document.getElementById('lockIcon').innerText = isLocked ? "🔒" : "🔓";
                    document.getElementById('lockText').innerText = isLocked ? "车门已锁定" : "车门已解锁";
                    reply = isLocked ? "车辆已落锁，请注意安全。" : "车门已解锁，请小心开门。";
                    break;
                case 'car':
                    reply = "为您播报车辆信息：当前车型为赛博纪元 X1，纯电续航 650 公里，电池健康度 98%，四轮胎压正常。";
                    break;
                case 'nav':
                    if (!navConnected) {
                        reply = "您尚未连接手机导航软件。请使用数据线或蓝牙连接手机，并将导航投射到车机屏幕。";
                        navConnected = true; 
                    } else {
                        reply = "导航已连接。当前目的地：深圳湾公园，全程 15 公里，预计行驶 25 分钟，当前路况轻微拥堵。";
                    }
                    break;
                case 'media':
                    reply = "正在为您打开多媒体中心。您可以通过语音搜索想听的歌曲或电台。";
                    break;
                case 'settings':
                    reply = "已为您打开系统设置。在这里可以调节屏幕亮度、声音均衡器以及系统语言。";
                    break;
            }
            addAIMessage(reply);
        }

        // ================= 4. 聊天与核心指令提取 =================
        const chatBox = document.getElementById('chatBox');
        
        function addAIMessage(text) {
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-msg';
            aiDiv.innerText = text;
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg'; userDiv.innerText = text;
            chatBox.appendChild(userDiv); input.value = ''; 

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-msg';
            loadingDiv.innerHTML = '执行中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>'; 
            chatBox.appendChild(loadingDiv); chatBox.scrollTop = chatBox.scrollHeight;

            const sessionId = window.sessionId || (window.sessionId = Math.random().toString(36).substring(7));

            try {
                const response = await fetch('http://127.0.0.1:8000/chat_stream', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, session_id: sessionId })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let aiReply = ''; let isFirstChunk = true; let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n\n'); buffer = parts.pop(); 

                    for (const part of parts) {
                        if (part.startsWith('data: ')) {
                            const dataStr = part.substring(6).trim();
                            if (dataStr) {
                                try {
                                    const dataObj = JSON.parse(dataStr);
                                    if (isFirstChunk && dataObj.text) { loadingDiv.innerHTML = ''; isFirstChunk = false; }
                                    aiReply += dataObj.text;
                                    loadingDiv.innerText = aiReply; chatBox.scrollTop = chatBox.scrollHeight;
                                    
                                    // ================= 🚨 终极意图拦截器 =================
                                    
                                    // 1. 动态提取定速巡航数字 (例如："定速巡航速度为 60 km/h")
                                    const speedMatch = aiReply.match(/(?:定速巡航|车速|速度为)\s*(?:为)?\s*(\d+)\s*(?:km\/h|公里)?/);
                                    if (speedMatch) {
                                        targetSpeed = parseInt(speedMatch[1], 10);
                                    }
                                    
                                    // 2. 停车/减速
                                    if (aiReply.includes("停车") || aiReply.includes("减速")) {
                                        targetSpeed = 0;
                                    }

                                    // 3. 空调联动
                                    if (aiReply.includes("空调已打开")) {
                                        if(!isACOn) handleScreenClick('ac'); // 直接复用之前的点击逻辑
                                    }
                                    if (aiReply.includes("空调已关闭")) {
                                        if(isACOn) handleScreenClick('ac');
                                    }

                                    // 4. 媒体联动
                                    if (aiReply.includes("音乐已开始播放") || aiReply.includes("正在为您播放")) {
                                        if(!isPlaying) handleScreenClick('music');
                                    }

                                    // 5. 电量联动
                                    if (aiReply.includes("15%") || aiReply.includes("15 %")) {
                                        updateBatteryChart(15);
                                    }

                                } catch (e) { console.error("解析失败:", dataStr); }
                            }
                        }
                    }
                }
            } catch (error) { loadingDiv.innerText = '网络连接中断。'; }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
